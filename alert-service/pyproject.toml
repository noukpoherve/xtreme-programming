[project]
name = "alert-service"
version = "0.1.0"
description = "UrbanHub Alert Service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.136.1",
    "pydantic-settings>=2.14.0",
    "redis>=7.4.0",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "black>=26.3.1",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "testcontainers>=4.14.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.black]
target-version = ["py313"]
