[project]
name = "urbanhub-docs"
version = "0.1.0"
description = "Documentation site for UrbanHub"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
docs = [
    "mkdocs-material==9.6.12",
    "mkdocs-minify-plugin==0.8.0",
    "mike==2.1.3",
]
docs-test = [
    "pytest>=9.0.3",
    "pytest-doctest-mkdocstrings>=0.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["alert-service/src", "iot-service/src"]
addopts = [
    "--doctest-modules",
    "--doctest-glob=docs/api/*.md",
    "--doctest-mdcodeblocks",
]
testpaths = ["docs/api"]
