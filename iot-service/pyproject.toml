[project]
name = "iot-service"
version = "0.1.0"
description = "UrbanHub IoT Ingestion Service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.14.0",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "black>=26.3.1",
    "httpx>=0.28.1",
    "mypy>=1.14.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "non_functional: tests non fonctionnels EC03 (performance, robustesse)",
]

[tool.black]
target-version = ["py313"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B311"]
