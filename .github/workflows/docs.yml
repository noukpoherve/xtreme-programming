name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "alert-service/src/**"
      - "iot-service/src/**"
      - "README.md"
      - "CHANGELOG.md"
      - "**/README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-docs:
    name: Deploy with mike
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install 3.13

      - name: Install documentation dependencies
        run: uv sync --group docs --group docs-test

      - name: Run documentation doctests (mkdocstrings examples)
        run: uv run --group docs-test pytest docs/api -v

      - name: Build MkDocs site (strict)
        run: uv run --group docs mkdocs build --strict

      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages --depth=1 || true

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Get doc version
        id: version
        run: |
          VERSION=$(grep -m 1 '^version' alert-service/pyproject.toml | cut -d '"' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Deploy docs with mike
        run: |
          uv run --group docs mike deploy \
            --push \
            --update-aliases \
            "${{ steps.version.outputs.version }}" latest

      - name: Set default documentation version
        run: uv run --group docs mike set-default --push latest
