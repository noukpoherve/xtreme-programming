name: CI - UrbanHub

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [alert-service, iot-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v4

      - name: Installer Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Vérifier le formatage (black)
        run: uv run black --check src/ tests/

      - name: Lancer les tests (pytest)
        run: uv run pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

  ci-success:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.test.result }}" == "failure" || "${{ needs.test.result }}" == "cancelled" ]]; then
            echo "❌ Tests failed."
            exit 1
          fi
          if [[ "${{ needs.docker-build.result }}" == "failure" || "${{ needs.docker-build.result }}" == "cancelled" ]]; then
            echo "❌ Docker build failed."
            exit 1
          fi
          echo "✅ All checks passed."

  release:
    runs-on: ubuntu-latest
    needs: [ci-success]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          # Extrait la version du service principal
          VERSION=$(grep -m 1 "version =" iot-service/pyproject.toml | cut -d '"' -f 2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        run: |
          TAG="v${{ env.VERSION }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping."
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --title "UrbanHub $TAG" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
