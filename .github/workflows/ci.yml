name: CI - UrbanHub

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions
permissions:
  contents: read

jobs:
  # ════════════════════════════════════════════════════════════════
  # 1. Lint & Format (Python + JS/TS)
  # ════════════════════════════════════════════════════════════════
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: "alert-service",     type: "python" }
          - { name: "iot-service",       type: "python" }
          - { name: "dashboard",         type: "node" }
    steps:
      - uses: actions/checkout@v4

      # Python services
      - name: Install uv
        if: matrix.service.type == 'python'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python
        if: matrix.service.type == 'python'
        run: uv python install 3.13

      - name: Sync dependencies
        if: matrix.service.type == 'python'
        working-directory: ${{ matrix.service.name }}
        run: uv sync --all-groups --no-progress

      - name: Ruff (lint + format check)
        if: matrix.service.type == 'python'
        working-directory: ${{ matrix.service.name }}
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Black (format check)
        if: matrix.service.type == 'python'
        working-directory: ${{ matrix.service.name }}
        run: uv run black --check --diff src/ tests/

      # Node service (dashboard)
      - name: Setup Node
        if: matrix.service.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        if: matrix.service.type == 'node'
        working-directory: ${{ matrix.service.name }}
        run: npm ci

      - name: TypeScript check
        if: matrix.service.type == 'node'
        working-directory: ${{ matrix.service.name }}
        run: npx tsc --noEmit

  # ════════════════════════════════════════════════════════════════
  # 2. Unit & Integration Tests (with coverage)
  # ════════════════════════════════════════════════════════════════
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        service:
          - alert-service
          - iot-service
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install 3.13

      - name: Sync dependencies
        working-directory: ${{ matrix.service }}
        run: uv sync --all-groups --no-progress

      - name: Run tests with coverage
        working-directory: ${{ matrix.service }}
        run: |
          uv run pytest tests/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=junit.xml

      - name: Upload coverage to Codecov
        if: matrix.service == 'alert-service'
        uses: codecov/codecov-action@v4
        with:
          files: ${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.service }}/junit.xml

  # ════════════════════════════════════════════════════════════════
  # 3. Security Scanning (DevSecOps)
  # ════════════════════════════════════════════════════════════════
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        service:
          - alert-service
          - iot-service
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install 3.13

      - name: Sync dependencies
        working-directory: ${{ matrix.service }}
        run: uv sync --all-groups --no-progress

      # ── SAST: Bandit (security linter for Python) ──
      - name: Bandit SAST
        working-directory: ${{ matrix.service }}
        run: |
          uv run bandit -r src/ -f json -o bandit-report.json || true
          uv run bandit -r src/ -f screen || true

      # ── SCA: pip-audit (known vulnerabilities in dependencies) ──
      - name: pip-audit SCA
        working-directory: ${{ matrix.service }}
        run: |
          uv run pip-audit --strict --format=json --output=pip-audit.json || true
          uv run pip-audit --strict || true

      # ── Secret detection (whole repo, run once) ──
      - name: Detect secrets (gitleaks)
        if: matrix.service == 'alert-service'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/bandit-report.json
            ${{ matrix.service }}/pip-audit.json

  # ════════════════════════════════════════════════════════════════
  # 4. Docker Image Build (smoke test)
  # ════════════════════════════════════════════════════════════════
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build alert-service
        uses: docker/build-push-action@v6
        with:
          context: ./alert-service
          push: false
          load: true
          tags: urbanhub/alert-service:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build iot-service
        uses: docker/build-push-action@v6
        with:
          context: ./iot-service
          push: false
          tags: urbanhub/iot-service:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: false
          tags: urbanhub/dashboard:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Trivy: vulnerability scan of built images ──
      - name: Trivy scan (alert-service)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: urbanhub/alert-service:ci-${{ github.sha }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  # ════════════════════════════════════════════════════════════════
  # 5. OpenAPI Export + Contract Validation
  # ════════════════════════════════════════════════════════════════
  openapi:
    name: OpenAPI Contract
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install 3.13

      - name: Sync dependencies
        working-directory: alert-service
        run: uv sync --all-groups --no-progress

      - name: Export OpenAPI spec
        working-directory: alert-service
        run: |
          mkdir -p api-specs
          PYTHONPATH=src uv run python scripts/export_openapi.py --in-process --service alert-service

      - name: Upload spec artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: alert-service/api-specs/

      - name: Validate spec with swagger-cli
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: |
            npm install -g @apidevtools/swagger-cli
            swagger-cli validate alert-service/api-specs/alert-service-*.json

  # ════════════════════════════════════════════════════════════════
  # 6. Aggregate Status Check
  # ════════════════════════════════════════════════════════════════
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, security, docker-build, openapi]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.lint.result }}" == "cancelled" ]]; then
            echo "❌ Lint failed."
            exit 1
          fi
          if [[ "${{ needs.test.result }}" == "failure" || "${{ needs.test.result }}" == "cancelled" ]]; then
            echo "❌ Tests failed."
            exit 1
          fi
          if [[ "${{ needs.security.result }}" == "failure" || "${{ needs.security.result }}" == "cancelled" ]]; then
            echo "❌ Security scan failed."
            exit 1
          fi
          if [[ "${{ needs.docker-build.result }}" == "failure" || "${{ needs.docker-build.result }}" == "cancelled" ]]; then
            echo "❌ Docker build failed."
            exit 1
          fi
          if [[ "${{ needs.openapi.result }}" == "failure" || "${{ needs.openapi.result }}" == "cancelled" ]]; then
            echo "❌ OpenAPI validation failed."
            exit 1
          fi
          echo "✅ All CI checks passed!"

  # ════════════════════════════════════════════════════════════════
  # 7. Release (only on master pushes)
  # ════════════════════════════════════════════════════════════════
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: ci-success
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep -m 1 "^version" alert-service/pyproject.toml | cut -d '"' -f 2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "UrbanHub v${{ steps.get_version.outputs.version }}"
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false