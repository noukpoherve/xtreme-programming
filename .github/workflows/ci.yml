name: CI - UrbanHub

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [alert-service, iot-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v4

      - name: Installer Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Vérifier le formatage (black)
        run: uv run black --check src/ tests/

      - name: Lancer les tests (pytest)
        run: uv run pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

  ci-success:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.test.result }}" == "failure" || "${{ needs.test.result }}" == "cancelled" ]]; then
            echo "❌ Tests failed."
            exit 1
          fi
          if [[ "${{ needs.docker-build.result }}" == "failure" || "${{ needs.docker-build.result }}" == "cancelled" ]]; then
            echo "❌ Docker build failed."
            exit 1
          fi
          echo "✅ All checks passed."
