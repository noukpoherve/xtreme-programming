name: CI - WaterQuality UrbanHub

# Déclencher la CI à chaque push et pull request
on: [push, pull_request]

jobs:
  ci:
    # Utiliser une machine Ubuntu vierge
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────
      # ÉTAPE 1 — Récupérer le code sur GitHub
      # ─────────────────────────────────────────
      - name: Récupérer le code
        uses: actions/checkout@v4
        # "uses" = utiliser une action pré-faite par GitHub
        # checkout = cloner votre repo sur la machine Ubuntu

      # ─────────────────────────────────────────
      # ÉTAPE 2 — Installer uv sur la machine CI
      # ─────────────────────────────────────────
      - name: Installer uv
        uses: astral-sh/setup-uv@v4
        # action officielle créée par l'équipe de uv
        # elle installe uv sur la machine Ubuntu

      # ─────────────────────────────────────────
      # ÉTAPE 3 — Installer Python 3.11
      # ─────────────────────────────────────────
      - name: Installer Python 3.11
        run: uv python install 3.11
        # "run" = exécuter une commande shell
        # uv gère l'installation de Python lui-même

      # ─────────────────────────────────────────
      # ÉTAPE 4 — Installer les dépendances
      # ─────────────────────────────────────────
      - name: Installer les dépendances
        run: uv sync --all-groups
        # lit le pyproject.toml
        # installe pytest, black, pre-commit
        # --all-groups = inclut les dépendances dev

      # ─────────────────────────────────────────
      # ÉTAPE 5 — Vérifier le formatage avec black
      # ─────────────────────────────────────────
      - name: Vérifier le formatage (black)
        run: uv run black --check src/ tests/
        # --check = ne modifie PAS les fichiers
        #           échoue si le code n'est pas bien formaté
        # en local black corrige, en CI black vérifie seulement

      # ─────────────────────────────────────────
      # ÉTAPE 6 — Lancer les tests
      # ─────────────────────────────────────────
      - name: Lancer les tests (pytest)
        run: uv run pytest tests/ -v
        # tests/ = cherche dans le dossier tests/
        # -v = verbose, affiche chaque test

      # ─────────────────────────────────────────
      # ÉTAPE 7 — Vérifier que le module s'importe
      # ─────────────────────────────────────────
      - name: Build check
        run: uv run python -c "
          import sys
          sys.path.insert(0, 'src')
          from water_quality_service import WaterQualityService
          print('Build OK ✅')
          "
        # vérifie que votre code s'importe sans erreur
        # sys.path.insert = dit à Python où chercher src/
